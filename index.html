<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>$$$</title>
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Jacob's personal budget: safe to spend, bills, budgets and savings.">
<meta name="theme-color" content="#F4F4F1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111214" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="$$$">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&display=swap">
<style>
/* Calm phone layout: one hero number, quiet rows, two tabs and a center log button */
:root{
  --ground:#F4F4F1; --surface:#FFFFFF; --ink:#16181B; --muted:#5F646B; --faint:#7A7F86;
  --line:#E4E4DF; --track:#E8E8E3; --soft:#E9E9E4;
  --accent:#4F5FB8; --accent-ink:#FFFFFF; --in:#3F7A57; --good:#4E8A66; --warn:#A8752A; --bad:#B44A3A;
  --btn:#16181B; --btn-ink:#F4F4F1; --tick:#9A9EA4;
  --font:"Geist",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --ground:#111214; --surface:#1B1D20; --ink:#ECEDEA; --muted:#9A9EA4; --faint:#80858C;
  --line:#26292D; --track:#2A2D31; --soft:#24272B;
  --accent:#8E9AF0; --accent-ink:#111214; --in:#7CC197; --good:#5FA47B; --warn:#D9A855; --bad:#E07A68;
  --btn:#ECEDEA; --btn-ink:#111214; --tick:#6B7077; color-scheme:dark}}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.4;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
html,body{overflow-x:hidden}
body{min-height:100dvh;overscroll-behavior-y:none}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
.small{font-size:12px;color:var(--muted)}
.muted{color:var(--muted)}
.in{color:var(--in)} .neg{color:var(--bad)}

.screen{max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:28px;
  padding:calc(env(safe-area-inset-top,0px) + 16px) max(24px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 112px) max(24px,env(safe-area-inset-left,0px))}
.topbar{display:flex;justify-content:space-between;align-items:center;min-height:44px}
.iconbtn{width:44px;height:44px;border:0;background:none;color:var(--muted);display:grid;place-items:center;border-radius:12px}
.iconbtn svg{width:22px;height:22px}
h1{margin:0;font-size:28px;font-weight:500;letter-spacing:-.02em}
.sec{display:flex;flex-direction:column;gap:14px}
.sec-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.sec-title{font-size:15px;font-weight:600}
.link{border:0;background:none;padding:6px 0;color:var(--accent);font-size:13px;font-weight:500}

.hero{display:flex;flex-direction:column;gap:8px;margin-top:-4px}
.hero-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.pill{font-size:12px;font-weight:600;padding:5px 10px;border-radius:999px;background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent);white-space:nowrap}
.pill.bad{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad)}
.hero .big .cur{font-size:.46em;font-weight:400;vertical-align:.78em;margin-right:4px;color:var(--muted);letter-spacing:0}
.hero .big.neg .cur{color:inherit}
.hero .label{font-size:14px;font-weight:500;color:var(--muted)}
.hero .big{font-size:clamp(54px,17vw,72px);font-weight:300;letter-spacing:-.04em;line-height:1}
.hero .sub{font-size:14px;line-height:1.45;color:var(--muted);max-width:34ch}

button.accts{border:0;width:100%;text-align:left;color:inherit;font:inherit}
.accts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));background:var(--surface);border-radius:18px;padding:16px 18px}
.accts>div{display:flex;flex-direction:column;gap:2px;min-width:0}
.accts>div+div{padding-left:14px;border-left:1px solid var(--line)}
.accts b{font-size:18px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.bar{position:relative;width:100%;height:6px;border-radius:3px;background:var(--track)}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--accent);max-width:100%}
.bar i.warn{background:var(--warn)} .bar i.bad{background:var(--bad)} .bar i.good{background:var(--good)}
.bar u{position:absolute;top:-3px;bottom:-3px;width:1.5px;background:var(--tick)}
.meter{display:flex;flex-direction:column;gap:8px;border:0;background:none;padding:0;text-align:left;width:100%}
.meter-top{display:flex;justify-content:space-between;gap:8px;font-size:14px}
.meter-top b{font-weight:500}

.card{background:var(--surface);border-radius:18px;padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.outline{border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;gap:14px;align-items:flex-start}

.list{display:flex;flex-direction:column}
.ev{display:flex;align-items:center;gap:14px;padding:10px 0;border-top:1px solid var(--line);min-height:52px}
.list>.ev:first-child{border-top:0}
.ev .d{width:44px;height:46px;flex:none;border-radius:12px;background:var(--soft);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.ev .d span{font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.ev .d b{font-size:17px;font-weight:600;line-height:1}
.ev .n{flex:1;min-width:0;font-size:14px;display:flex;flex-direction:column;align-items:flex-start;gap:4px}
.ev .n span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ev .a{font-size:14px;font-weight:500;text-align:right;white-space:nowrap}
.ev .after{width:58px;text-align:right;font-size:12px;color:var(--muted);flex:none}
.ev.late .d span{color:var(--bad)}
.mini{border:0;border-radius:8px;background:var(--soft);color:var(--ink);font-size:12px;font-weight:600;padding:5px 10px}
.group-label{font-size:12px;font-weight:600;letter-spacing:.04em;color:var(--muted);padding-top:6px}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--ground) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);
  padding:8px max(12px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 8px) max(12px,env(safe-area-inset-left,0px))}
nav.tabs .in{max-width:420px;margin:0 auto;display:flex;justify-content:space-between;align-items:center}
.tab{border:0;background:none;min-width:58px;padding:6px 0;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:500;color:var(--faint)}
.tab svg{width:22px;height:22px}
.tab[aria-current="true"]{color:var(--ink);font-weight:600}
.logbtn{width:56px;height:56px;border-radius:28px;border:0;background:var(--btn);color:var(--btn-ink);display:grid;place-items:center;margin-top:-4px}
.logbtn svg{width:24px;height:24px}

/* sheets */
.scrim{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.32)}
.sheet{position:fixed;left:0;right:0;bottom:0;top:0;z-index:31;background:var(--ground);overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.sheet .wrap{max-width:480px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;gap:24px;
  padding:calc(env(safe-area-inset-top,0px) + 12px) max(24px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 24px) max(24px,env(safe-area-inset-left,0px))}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .24s cubic-bezier(.2,.8,.2,1)}@keyframes up{from{transform:translateY(24px);opacity:0}}}
.sheet-top{display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:44px}
.seg{display:flex;background:var(--soft);border-radius:12px;padding:3px}
.seg button{flex:1;border:0;border-radius:9px;padding:8px 14px;font-size:13px;font-weight:500;background:none;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.amount{display:flex;flex-direction:column;align-items:center;gap:6px}
.amt-row{display:flex;justify-content:center;align-items:baseline;gap:2px;width:100%;font-size:clamp(48px,15vw,60px);font-weight:300;letter-spacing:-.04em}
.amt-row span{color:var(--muted)}
.amount input{width:1.3ch;max-width:85%;text-align:left;border:0;background:none;font-size:inherit;font-weight:300;letter-spacing:inherit;padding:0;outline:none;color:var(--ink)}
.amount input::placeholder{color:var(--tick)}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>label,.flabel{font-size:12px;font-weight:500;color:var(--muted)}
.field input,.field select{font-size:16px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;width:100%;min-width:0;color:var(--ink);-webkit-appearance:none;appearance:none}
.field input[type="date"]{min-height:48px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-size:14px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 14px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:500}
.chip.new{border-style:dashed;background:none;color:var(--muted)}
.newcat{display:flex;gap:8px;width:100%}
.newcat input{flex:1;min-width:0;font-size:16px;background:var(--surface);border:1px solid var(--accent);border-radius:999px;padding:9px 14px;color:var(--ink)}
.primary{border:0;border-radius:16px;padding:17px 0;width:100%;background:var(--btn);color:var(--btn-ink);font-size:16px;font-weight:600}
.primary:disabled{opacity:.5}
.ghost{border:1px solid var(--line);border-radius:14px;padding:14px 0;width:100%;background:var(--surface);font-size:15px;font-weight:500}
.danger{color:var(--bad)}
.check{display:flex;gap:12px;align-items:center;font-size:14px}
.check input{width:22px;height:22px;accent-color:var(--accent);flex:none}
.spacer{flex:1}

/* settings */
.group{display:flex;flex-direction:column;gap:8px}
.group-head{display:flex;justify-content:space-between;align-items:baseline;padding:0 4px}
.group-head h2{margin:0;font-size:13px;font-weight:600;color:var(--muted)}
.group-head h2 span{font-weight:400}
.box{background:var(--surface);border-radius:16px;display:flex;flex-direction:column;overflow:hidden}
.item{display:flex;align-items:center;gap:12px;padding:13px 16px;border:0;border-top:1px solid var(--line);background:none;text-align:left;width:100%;min-height:56px}
.box>.item:first-child{border-top:0}
.item .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.item .t b{font-size:15px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .v{font-size:15px;white-space:nowrap}
.item .chev{width:16px;height:16px;color:var(--tick);flex:none}
.item input.inl{width:96px;text-align:right;font-size:16px;background:var(--ground);border:0;border-radius:10px;padding:9px 10px;color:var(--ink)}
.item input.inl::placeholder{color:var(--faint)}
.empty{padding:28px 8px;text-align:center;color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 96px);z-index:40;background:var(--btn);color:var(--btn-ink);padding:11px 16px;border-radius:12px;font-size:14px;font-weight:500;max-width:calc(100% - 48px);text-align:center}
figure{margin:0}
.bc{gap:14px}
.bc-main{display:flex;flex-direction:column;gap:6px;border:0;background:none;padding:0;text-align:left;color:inherit;font:inherit}
.bc-big{font-size:clamp(40px,12vw,48px);font-weight:300;letter-spacing:-.035em;line-height:1}
.bc-big .cur{font-size:.5em;font-weight:400;vertical-align:.7em;margin-right:3px;color:var(--muted);letter-spacing:0}
.bc-big.neg .cur{color:inherit}
.bc-split{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.bc-g{display:flex;flex-direction:column;gap:2px;border:0;border-radius:14px;background:var(--ground);padding:12px 14px;text-align:left;color:inherit;font:inherit;min-width:0}
.bc-g b{font-size:20px;font-weight:500;letter-spacing:-.01em}
.bc-g .bar{margin-top:8px}
.bc-alerts{display:flex;flex-direction:column;gap:6px}
.updbar{position:fixed;left:16px;right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 92px);z-index:25;display:flex;justify-content:space-between;align-items:center;gap:12px;border:0;border-radius:14px;padding:13px 16px;background:var(--accent);color:var(--accent-ink);font:inherit;font-size:14px;max-width:448px;margin:0 auto;box-shadow:0 4px 16px rgba(0,0,0,.18)}
.cc-chips{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:10px;margin-top:6px}
.cc-chip{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:12px 14px;min-width:0;border:0;border-radius:16px;background:var(--surface);color:var(--muted);font:inherit;font-size:13px;text-align:left}
.cc-chip b{color:var(--ink);font-size:26px;font-weight:400;letter-spacing:-.02em;line-height:1.15}
.ccard{display:flex;align-items:center;gap:12px;border:0;border-top:1px solid var(--line);background:none;padding:12px 0 8px;width:100%;text-align:left;color:inherit;font:inherit}
.ccard .chev{width:16px;height:16px;color:var(--tick);flex:none}
.cc-v{display:flex;flex-direction:column;align-items:flex-end;white-space:nowrap}
.cc-v b{font-size:16px;font-weight:600}
.card.due{border:1.5px solid color-mix(in srgb,var(--accent) 45%,transparent)}
.newcat-g{display:flex;align-items:center;gap:10px;width:100%}
.newcat-g .seg{flex:1}
details.bud{border-top:1px solid var(--line)}
details.bud summary{list-style:none;display:flex;align-items:center;gap:12px;padding:12px 0;cursor:pointer;min-height:56px}
details.bud summary::-webkit-details-marker{display:none}
details.bud summary .chev{width:16px;height:16px;color:var(--tick);flex:none;transition:transform .2s}
details.bud[open] summary .chev{transform:rotate(90deg)}
.bud-in{background:var(--ground);border-radius:14px;margin:0 0 12px;display:flex;flex-direction:column;overflow:hidden}
.bud-in .item{border-top:0}
.bud-in input.inl{background:var(--surface)}
.budline{display:flex;gap:10px;align-items:flex-start;background:var(--surface);border-radius:14px;padding:12px 14px;font-size:14px;line-height:1.4}
.budline>div{flex:1;display:flex;flex-direction:column;gap:6px;min-width:0}
.budline b{font-weight:600} .budline.warn b{color:var(--warn)} .budline.bad b{color:var(--bad)} .budline.good b{color:var(--good)}
.alert{display:flex;gap:8px;align-items:baseline;border:0;background:none;padding:2px 0;text-align:left;font-size:14px;color:var(--ink)}
.chat{flex:1;display:flex;flex-direction:column;gap:10px;min-height:40vh}
.bub{max-width:88%;padding:11px 14px;border-radius:18px;font-size:15px;line-height:1.45;overflow-wrap:anywhere}
.bub.bot{align-self:flex-start;background:var(--surface);border-bottom-left-radius:6px}
.bub.me{align-self:flex-end;background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:6px}
.chat-btns{display:flex;gap:8px;margin-top:10px}
.chat-btns .mini{padding:9px 14px;font-size:14px}
.chat-in{position:sticky;bottom:0;display:flex;gap:8px;align-items:center;background:var(--ground);padding:8px 0 4px}
.chat-in input{flex:1;min-width:0;font-size:16px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:12px 16px;color:var(--ink)}
.send,.mic{width:44px;height:44px;border-radius:22px;border:0;display:grid;place-items:center;flex:none;background:var(--btn);color:var(--btn-ink)}
.mic{background:var(--soft);color:var(--ink);touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.mic.on{background:var(--bad);color:#fff}
.send svg,.mic svg{width:20px;height:20px}
.pk{text-align:left;width:100%;border:0;color:inherit;font:inherit;gap:10px}
.pk-row{display:flex;align-items:center;gap:12px}
.pk-emo{width:44px;height:44px;border-radius:12px;background:var(--soft);display:grid;place-items:center;font-size:22px;flex:none}
.pk-t{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.pk-t b{font-size:15px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pk-v{font-size:16px;font-weight:600;white-space:nowrap}
.pk-row .chev{width:16px;height:16px;color:var(--tick);flex:none}
.seg button:disabled{opacity:.45}
.goal{flex-direction:row;align-items:center;gap:16px}
.ring{width:64px;height:64px;flex:none}
.goal-t{display:flex;flex-direction:column;gap:3px;min-width:0;font-size:15px}
.goal-t b{font-size:15px;font-weight:600}
.stat{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border-radius:16px;padding:14px 16px}
.stat .ic{font-size:20px;line-height:1.25}
.stat div{display:flex;flex-direction:column;gap:3px;min-width:0}
.stat b{font-size:16px;font-weight:600} .stat.good b{color:var(--good)} .stat.warn b{color:var(--warn)} .stat.bad b{color:var(--bad)}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.kpi{display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi .kv{font-size:clamp(24px,8vw,30px);font-weight:400;letter-spacing:-.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.delta{font-size:12px;font-weight:600}
.readout{font-size:13px;line-height:1.5;color:var(--muted);min-height:40px}
.readout b{color:var(--ink);font-weight:600}
.slider{display:flex;flex-direction:column;gap:4px}
.slider-top{display:flex;justify-content:space-between;gap:8px;font-size:14px}
input[type=range]{width:100%;height:32px;margin:0;accent-color:var(--accent)}
details.mon{border-top:1px solid var(--line)}
details.mon summary{list-style:none;display:flex;align-items:center;gap:12px;padding:14px 0;cursor:pointer;min-height:56px}
details.mon summary::-webkit-details-marker{display:none}
details.mon summary .chev{width:16px;height:16px;color:var(--tick);flex:none;transition:transform .2s} details.mon[open] summary .chev{transform:rotate(90deg)}
.mt{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0}
.mt b{font-size:15px;font-weight:500}
.mn{font-size:15px;font-weight:600;white-space:nowrap}
.mbars{display:flex;flex-direction:column;gap:5px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:14px;height:2px;display:inline-block}
</style>
</head>
<body>
<main id="app" class="screen"></main>

<nav class="tabs" aria-label="Sections"><div class="in">
  <button class="tab" data-view="home" aria-current="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" aria-hidden="true"><path d="M4 10.5 12 4l8 6.5V20H4z"/></svg>Home</button>
  <button class="tab" data-view="plan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 17l5-5 4 3 7-8"/></svg>Plan</button>

/* ================= schedules ================= */
function baseDates(it, s, e){
  const S0 = it.start && pd(it.start) > s ? pd(it.start) : s;

  const out = [];
  if (S0 > E0) return out;
  if (it.rule === "once"){ const d = pd(it.date); if (d >= S0 && d <= E0) out.push(d); }
  else if (it.rule === "monthly"){
    const days = it.days || [it.day || 1]; let y = S0.getFullYear(), m = S0.getMonth();
    while (new Date(y, m, 1) <= E0){
      for (const dd of days){ const d = new Date(y, m, Math.min(dd, dim(y, m))); if (d >= S0 && d <= E0) out.push(d); }
      if (++m > 11){ m = 0; y++; }
    }
  } else if (it.rule === "weekly"){
    let d = it.start ? pd(it.start) : new Date(S0);

    const step = 7 * (it.every || 1);
    while (d <= E0){ if (d >= S0) out.push(new Date(d)); d = addDays(d, step); }
  } else if (it.rule === "every_months"){

}
// Scheduled dates after one-off moves/skips (it.moves, keyed by the original date) and the weekend rule (it.weekend)
function occurrences(it, s, e){
  if (!it.moves && !it.weekend) return baseDates(it, s, e).map(d => ({d, orig: d}));
  const out = [];
  for (const o of baseDates(it, addDays(s, -10), addDays(e, 10))){
    const mv = it.moves && it.moves[iso(o)]; if (mv === "skip") continue;
    let d = mv ? pd(mv) : o;

}

  if (it.rule === "weekly") return (it.every || 1) === 2 ? "biweekly" : "weekly";
  if (it.rule === "every_months") return it.months === 12 ? "yearly" : it.months === 6 ? "semi" : "quarterly";

}

/* ================= money math ================= */
function balances(){
  const st = S().start || {};
  const b = {checking: +st.checking || 0, savings: +st.savings || 0, card: +st.card || 0};
  for (const t of TX()){
    const a = +t.amount || 0;

    else if (t.type === "income") b.checking += a;
    else if (t.type === "save"){ b.checking -= a; b.savings += a; }
    else if (t.type === "pull"){ b.savings -= a; b.checking += a; }
    else if (t.type === "cardpay"){ b.checking -= a; b.card = Math.max(0, b.card - a); } // purchases you didn't log are covered by the payment
    else if (t.type === "adjust" && t.account in b) b[t.account] += a;
  }

  return b;
}
const done = ref => TX().some(t => t.ref === ref);
function project(days, autoOverride, spendMonthly, withPockets){
  const t0 = today(), asOf = S().start?.asOf ? pd(S().start.asOf) : t0;

      if (inc.autoSave && auto > 0) ev.push({d, name: "To savings", amt: -auto, kind: "save", ord: 1, ref: ref + ":save"});
    }
  }

    if (b.amount === "card" && cardsList().length) continue;
    let first = true;
    for (const {d, orig} of occurrences(b, s, e)){
      const ref = `${b.id}@${iso(orig)}`;
      let amt = b.amount;
      if (amt === "card") amt = first && bal.card > 0 ? bal.card : (+b.fallback || 0);
      first = false;
      if (done(ref)) continue;
      ev.push({d, name: b.name, amt: -amt, kind: b.amount === "card" ? "card" : "out", ord: 2, ref, item: b});
    }

    if (!c.due) continue;
    let first = true;
    for (const {d, orig} of occurrences({rule: "monthly", days: [+c.due]}, s, e)){
      const ref = `${c.billId || "card:" + c.id}@${iso(orig)}`;
      const amt = first ? Math.max(0, cbal[c.id] || 0) : (+c.usual || cbal[c.id] || 0); first = false;
      if (done(ref) || !(amt > 0)) continue;
      ev.push({d, name: `${c.name} payment`, amt: -amt, kind: "card", ord: 2, ref, cardId: c.id});
    }
  }
  if (withPockets){
    const pays = [...new Set(ev.filter(x => x.kind === "in" && x.d >= t0).map(x => iso(x.d)))].sort();
    for (const p of pockets()){
      if (!p.plan) continue;
      let left = Math.max(0, pocketGoal(p) - pocketIn(p)); const per = pocketPerPay(p); if (!per) continue;
      for (const ds of pays){
        if (!left || (p.date && ds > p.date)) break;
        const a = Math.min(per, left); left -= a;
        ev.push({d: pd(ds), name: `${p.emoji || ""} ${p.name}`.trim(), amt: -a, kind: "save", ord: 1, ref: `pocket:${p.id}@${ds}`});
      }
    }
  }
  if (spendMonthly > 0){ const wk = Math.round(spendMonthly * 12 / 52 * 100) / 100; for (let d = addDays(t0, 1); d <= e; d = addDays(d, 7)) ev.push({d, name: "Everyday spending", amt: -wk, kind: "spend", ord: 3, ref: "spend@" + iso(d)}); }

}
const cats = () => S().categories || [];
const catOf = id => cats().find(c => c.id === id) || {id, label: id === "pocket" ? "Pockets" : "Other", group: "wants", budget: 0};
function spendIn(y, m){
  const by = {};
  for (const x of TX()){
    if (x.type !== "expense" || x.pocket) continue;
    const d = pd(x.date); if (d.getFullYear() !== y || d.getMonth() !== m) continue;
    by[x.category] = (by[x.category] || 0) + +x.amount;
  }

}
function usageOrder(){
  const n = {}; for (const t of TX()) if (t.type === "expense") n[t.category] = (n[t.category] || 0) + 1;
  return [...cats()].sort((a, b) => (n[b.id] || 0) - (n[a.id] || 0));
}
function goalDate(auto){
  const g = S().goal; if (!g?.target) return null;
  const held = pocketsHeld();
  if (balances().savings - held >= g.target) return "done";
  const ev = project(730, auto).find(x => x.sav - held >= g.target);
  return ev ? ev.d : null;

/* ================= views ================= */
let view = "home";
// What a category "should" have spent by today: scheduled bills that are already due, plus an even pace for the rest.
function expectedFor(c, y, m){
  const bud = +c.budget || 0; if (!bud) return 0;
  const t = today(), isNow = y === t.getFullYear() && m === t.getMonth();
  const first = new Date(y, m, 1), last = new Date(y, m, dim(y, m));
  const pace = isNow ? t.getDate() / dim(y, m) : (last < t ? 1 : 0);
  let billAll = 0, billDue = 0;
  for (const b of S().bills || []){
    if (b.category !== c.id || b.amount === "card") continue;
    for (const d of ruleDates(b, first, last)){ billAll += +b.amount; if (!isNow || d <= t) billDue += +b.amount; }
  }
  if (!isNow && last < t) billDue = billAll;
  return Math.min(bud, billDue + Math.max(0, bud - billAll) * pace);

function barHTML(spent, budget, expected, cls){
  const f = budget > 0 ? spent / budget : 0, ef = budget > 0 && expected != null ? expected / budget : null;

  return `<div class="bar">${budget > 0 ? `<i class="${c}" style="width:${Math.min(100, f*100).toFixed(1)}%"></i>` : ""}${ef != null && ef < 0.995 ? `<u style="left:${(ef*100).toFixed(1)}%"></u>` : ""}</div>`;

  const days = dim(t.getFullYear(), t.getMonth());

    const list = cats().filter(c => (c.group === "needs" ? "needs" : "wants") === g);
    const ids = new Set(list.map(c => c.id));
    const bud = list.reduce((s, c) => s + (+c.budget || 0), 0);

  const sub = bankSafe < 0 ? `Checking runs short${lowAt ? ` around ${fmtShort(lowAt.d)} (${lowAt.name})` : ""}. Hold off on spending or move ${money(-bankSafe)} from savings.`
    : `${held.length ? `After holding back ${held.join(", ").replace(/, ([^,]*)$/, " and $1")}. ` : ""}Everything due through ${fmtShort(end)} is covered.`;

// Monthly rate of everyday spending from what's been logged (last 90 days). Scheduled bills and pockets don't count.
function trend(){
  const billCats = new Set((S().bills || []).filter(b => b.amount !== "card").map(b => b.category));

  if (!exp.length) return null;
  const t = today(), first = exp.reduce((m, x) => x.date < m ? x.date : m, exp[0].date);
  let from = pd(first); if (from < addDays(t, -89)) from = addDays(t, -89);
  const days = Math.round((t - from) / 864e5) + 1;
  const byCat = {}; let total = 0;
  for (const x of exp){ const d = pd(x.date); if (d < from || d > t) continue; total += +x.amount; byCat[x.category] = (byCat[x.category] || 0) + +x.amount; }
  const k = 30.44 / Math.max(days, 7); for (const c in byCat) byCat[c] *= k; // at least a week, so a few days of data don't spike it

}

const autoSavers = () => (S().income || []).some(i => i.autoSave);

function planChart(P){

function budStatus(sp, bu, exp){
  if (!bu) return "";
  if (sp > bu + .005) return "bad";
  if (sp >= bu * .9 || (exp != null && exp < bu && sp > exp + bu * .1)) return "warn";
  return "good";
}
const BUD_ICON = {bad: "❌", warn: "⚠️", good: "✅"};

function budAfter(catId, amount, dateStr){
  const c = catOf(catId), bu = +c.budget || 0, d = pd(dateStr || iso(today()));
  const sp = spendIn(d.getFullYear(), d.getMonth())[catId] || 0, after = sp + (+amount || 0), left = bu - after;
  const st = !bu ? "" : left < -.005 ? "bad" : after >= bu * .9 ? "warn" : "good";
  const msg = !bu ? `No budget set for ${c.label}` : left < -.005 ? `This puts you ${money(-left)} over your ${c.label} budget` : `${money(left)} left in ${c.label} after this${st === "warn" ? ", almost at your limit" : ""}`;
  return {c, bu, sp, after, left, st, msg};
}

function saveMatch(){

async function exportData(){
  const name = `money-backup-${iso(today())}.json`;

  try {
    const file = new File([blob], name, {type: "application/json"});
    if (navigator.canShare && navigator.canShare({files: [file]})){ await navigator.share({files: [file], title: "$$$ backup"}); return; }
  } catch(e){ if (e && e.name === "AbortError") return; }
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click();

}
function importData(file){

    catch(e){ toast("That file isn't a $$$ backup"); }

    const m = t.match(/VERSION = "([^"]+)"/);
    if (m && m[1] !== APP_BUILD && !$("#updBar")){
      const bar = document.createElement("button"); bar.id = "updBar"; bar.className = "updbar";
      bar.innerHTML = "<span>A new version is ready</span><b>Update</b>"; bar.onclick = () => $("#sheet").hidden ? updateNow() : toast("Finish what you're entering first");
      document.body.appendChild(bar);
    }
  }).catch(() => {});
}
checkVersion();
document.addEventListener("visibilitychange", () => { if (!document.hidden) checkVersion(); });
try { if (sessionStorage.getItem(KEY + ":updated")){ sessionStorage.removeItem(KEY + ":updated"); toast("Updated to the newest version"); } } catch(e){}
if ("serviceWorker" in navigator && location.protocol === "https:"){
  const hadController = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.register("sw.js", {updateViaCache: "none"}).then(reg => {
    document.addEventListener("visibilitychange", () => { if (!document.hidden) reg.update().catch(() => {}); });
  }).catch(() => {});
  navigator.serviceWorker.addEventListener("controllerchange", () => {
    if (!hadController) return;
    if ($("#sheet").hidden){ try { sessionStorage.setItem(KEY + ":updated", "1"); } catch(e){} location.reload(); }
    else RELOAD = true;
  });
}
</script>
</body>
</html>
