<script>
"use strict";
/* ================= data ================= */
const KEY = "jacobs-money.v1";
const SEED = {
  version: 1,
  settings: {
    start: {asOf: "", checking: 0, savings: 0, card: 0},
    autoSave: 0, cushion: 0,
    goal: {name: "Emergency fund", target: 0},
    income: [],
    bills: [],
    categories: [
      {id: "rent", label: "Rent", group: "needs", budget: 0},
      {id: "insurance", label: "Insurance", group: "needs", budget: 0},
      {id: "utilities", label: "WiFi and utilities", group: "needs", budget: 0},
      {id: "groceries", label: "Groceries", group: "needs", budget: 0},
      {id: "phone", label: "Phone", group: "needs", budget: 0},
      {id: "transport", label: "Gas and parking", group: "needs", budget: 0},
      {id: "bills", label: "Other bills", group: "needs", budget: 0},
      {id: "dining", label: "Dining out", group: "wants", budget: 0},
      {id: "subscriptions", label: "Subscriptions", group: "wants", budget: 0},
      {id: "band", label: "Band and gear", group: "wants", budget: 0},
      {id: "travel", label: "Travel", group: "wants", budget: 0},
      {id: "shopping", label: "Shopping", group: "wants", budget: 0},
      {id: "fun", label: "Fun", group: "wants", budget: 0}
    ]
  },
  tx: []
};
let DATA;
function load(){
  try { const raw = localStorage.getItem(KEY); if (raw){ const d = JSON.parse(raw); if (d && d.settings && Array.isArray(d.tx)) return d; } } catch(e){}
  const d = JSON.parse(JSON.stringify(SEED)); d.settings.start.asOf = new Date().toLocaleDateString("en-CA"); return d; // YYYY-MM-DD, first open
}
function persist(){
  try { localStorage.setItem(KEY, JSON.stringify(DATA)); return true; }
  catch(e){ toast("Couldn't save on this device. Export a backup now."); return false; }
}
DATA = load();
try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch(e){}
const S = () => DATA.settings;
const TX = () => DATA.tx;

/* ================= helpers ================= */
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2, "0");
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const pd = s => { const [y,m,d] = String(s).split("-").map(Number); return new Date(y, m-1, d); };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
const today = () => { const t = new Date(); return new Date(t.getFullYear(), t.getMonth(), t.getDate()); };
const dim = (y, m) => new Date(y, m+1, 0).getDate();
const fmtWD = d => d.toLocaleDateString("en-US", {weekday:"short"});
const fmtShort = d => d.toLocaleDateString("en-US", {month:"short", day:"numeric"});
const fmtDay = d => d.toLocaleDateString("en-US", {weekday:"short", month:"short", day:"numeric"});
const ord = n => n + (n % 100 >= 11 && n % 100 <= 13 ? "th" : ({1:"st",2:"nd",3:"rd"}[n % 10] || "th"));
const WD = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const newId = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const num = v => { const n = parseFloat(String(v ?? "").replace(/[$,\s]/g, "")); return Number.isFinite(n) ? Math.round(n*100)/100 : 0; };
function money(n, cents = false){
  const a = Math.abs(n), s = "$" + a.toLocaleString("en-US", {minimumFractionDigits: cents?2:0, maximumFractionDigits: cents?2:0});
  return n < -0.004 ? "(" + s + ")" : s;
}
let toastT;
function toast(msg){ const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 2600); }
const ICON = {
  sliders: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>',
  back: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>',
  close: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>',
  chev: '<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>'
};

/* ================= schedules ================= */
function ruleDates(it, s, e){
  const S0 = it.start && pd(it.start) > s ? pd(it.start) : s;
  const E0 = it.end && pd(it.end) < e ? pd(it.end) : e;
  const out = [];
  if (S0 > E0) return out;
  if (it.rule === "once"){ const d = pd(it.date); if (d >= S0 && d <= E0) out.push(d); }
  else if (it.rule === "monthly"){
    const days = it.days || [it.day || 1]; let y = S0.getFullYear(), m = S0.getMonth();
    while (new Date(y, m, 1) <= E0){
      for (const dd of days){ const d = new Date(y, m, Math.min(dd, dim(y, m))); if (d >= S0 && d <= E0) out.push(d); }
      if (++m > 11){ m = 0; y++; }
    }
  } else if (it.rule === "weekly"){
    let d = it.start ? pd(it.start) : new Date(S0);
    while (d.getDay() !== it.weekday) d = addDays(d, 1);
    const step = 7 * (it.every || 1);
    while (d <= E0){ if (d >= S0) out.push(new Date(d)); d = addDays(d, step); }
  } else if (it.rule === "every_months"){
    const b = pd(it.start);
    for (let k = 0; k < 600; k++){
      const f = new Date(b.getFullYear(), b.getMonth() + k*it.months, 1);
      const d = new Date(f.getFullYear(), f.getMonth(), Math.min(b.getDate(), dim(f.getFullYear(), f.getMonth())));
      if (d > E0) break; if (d >= S0) out.push(d);
    }
  }
  return out.sort((a, b) => a - b);
}
function freqOf(it){
  if (it.rule === "once") return "once";
  if (it.rule === "monthly") return (it.days || []).length > 1 ? "twice" : "monthly";
  if (it.rule === "weekly") return (it.every || 1) === 2 ? "biweekly" : "weekly";
  if (it.rule === "every_months") return it.months === 12 ? "yearly" : it.months === 6 ? "semi" : "quarterly";
  return "monthly";
}

/* ================= money math ================= */
function balances(){
  const st = S().start || {};
  const b = {checking: +st.checking || 0, savings: +st.savings || 0, card: +st.card || 0};
  for (const t of TX()){
    const a = +t.amount || 0;
    if (t.type === "expense"){ if (t.method === "card") b.card += a; else if (t.method === "checking") b.checking -= a; else if (t.method === "savings") b.savings -= a; }
    else if (t.type === "income") b.checking += a;
    else if (t.type === "save"){ b.checking -= a; b.savings += a; }
    else if (t.type === "pull"){ b.savings -= a; b.checking += a; }
    else if (t.type === "cardpay"){ b.checking -= a; b.card = Math.max(0, b.card - a); } // purchases you didn't log are covered by the payment

}

  for (const inc of S().income || []){
    for (const d of ruleDates(inc, s, e)){
      const ref = `${inc.id}@${iso(d)}`; if (done(ref)) continue;
      ev.push({d, name: inc.name, amt: +inc.amount, kind: "in", ord: 0, ref, item: inc});
      if (inc.autoSave && auto > 0) ev.push({d, name: "To savings", amt: -auto, kind: "save", ord: 1, ref: ref + ":save"});
    }

      first = false;
      if (done(ref)) continue;

  for (const x of ev){ chk += x.amt; if (x.kind === "save") sav -= x.amt; x.chk = chk; x.sav = sav; x.late = x.d < t0; }

}
const cats = () => S().categories || [];
const catOf = id => cats().find(c => c.id === id) || {id, label: id || "Other", group: "wants", budget: 0};

// What a category "should" have spent by today: scheduled bills that are already due, plus an even pace for the rest.
function expectedFor(c, y, m){
  const bud = +c.budget || 0; if (!bud) return 0;
  const t = today(), isNow = y === t.getFullYear() && m === t.getMonth();
  const first = new Date(y, m, 1), last = new Date(y, m, dim(y, m));
  const pace = isNow ? t.getDate() / dim(y, m) : (last < t ? 1 : 0);
  let billAll = 0, billDue = 0;
  for (const b of S().bills || []){
    if (b.category !== c.id || b.amount === "card") continue;
    for (const d of ruleDates(b, first, last)){ billAll += +b.amount; if (!isNow || d <= t) billDue += +b.amount; }
  }

function syncEditor(){
  const f = $("#eFreq")?.value;
  if (f){ $("#w_eDay2").hidden = f !== "twice"; $("#w_eEnd").hidden = f === "once"; $("#w_eDate label").textContent = f === "once" ? "Date" : "Next date"; }
  if ($("#eCard")) $("#w_eAmt label").textContent = $("#eCard").checked ? "Estimate" : "Amount";
}
function saveEditor(){
  const {kind, id} = EDIT, name = $("#eName").value.trim();
  if (!name){ toast("Give it a name"); return; }
  if (kind === "cat"){
    const list = cats(), i = list.findIndex(c => c.id === id);
    const it = {id: i >= 0 ? id : newId("c"), label: name, group: EDIT.group || "wants", budget: num($("#eAmt").value)};
    if (i >= 0) list[i] = it; else list.push(it);
    S().categories = list;
  } else {
    const dateStr = $("#eDate").value; if (!dateStr){ toast("Pick a date"); return; }
    const freq = $("#eFreq").value;
    const it = {id: id === "new" ? newId(kind === "income" ? "i" : "b") : id, name, ...buildSchedule(freq, dateStr, $("#eDay2").value, freq === "once" ? "" : $("#eEnd").value)};
    if (kind === "income"){ it.amount = num($("#eAmt").value); it.autoSave = $("#eAuto").checked; }
    else { it.category = $("#eCat").value; if ($("#eCard").checked){ it.amount = "card"; it.fallback = num($("#eAmt").value); } else it.amount = num($("#eAmt").value); }
    if (!(it.amount === "card" || it.amount > 0)){ toast("Enter an amount above $0"); return; }
    const key = kind === "income" ? "income" : "bills", list = S()[key] || [], i = list.findIndex(x => x.id === id);
    if (i >= 0) list[i] = it; else list.push(it);
    S()[key] = list;
  }
  persist(); EDIT = null; closeSheet(); toast("Saved");
}
function deleteEditor(){
  if (!confirmDel){ confirmDel = true; $("#eDel").textContent = "Tap again to delete"; return; }
  const {kind, id} = EDIT, key = kind === "income" ? "income" : kind === "bill" ? "bills" : "categories";
  S()[key] = (S()[key] || []).filter(x => x.id !== id);
  persist(); EDIT = null; closeSheet(); toast("Deleted");
}

/* --- match bank --- */
function openMatch(){
  const b = balances();
  openSheet(`<div class="sheet-top"><button class="iconbtn" data-close aria-label="Close" style="margin-left:-12px">${ICON.close}</button><span style="font-weight:600">Your balances</span><span style="width:32px"></span></div>
    <span class="small" style="font-size:14px;line-height:1.5">Type what your bank app shows. The difference is saved as a balance fix, so your history stays intact.</span>
    ${fld("mChk","Checking",b.checking ? b.checking.toFixed(2) : "","text",'inputmode="decimal" placeholder="$0"')}${fld("mSav","Savings",b.savings ? b.savings.toFixed(2) : "","text",'inputmode="decimal" placeholder="$0"')}${fld("mCard","Credit card balance owed",b.card ? b.card.toFixed(2) : "","text",'inputmode="decimal" placeholder="$0"')}
    <div class="spacer"></div><button class="primary" id="mGo">Save balances</button>`);
  setTimeout(() => $("#mChk")?.focus(), 80);
}
function saveMatch(){
  const b = balances(), want = {checking: num($("#mChk").value), savings: num($("#mSav").value), card: num($("#mCard").value)};
  // Nothing logged yet: these simply become the starting balances
  if (!TX().length){ S().start = {asOf: iso(today()), ...want}; persist(); closeSheet(); return toast("Balances saved"); }
  let n = 0;
  for (const k of ["checking","savings","card"]){
    const d = Math.round((want[k] - b[k]) * 100) / 100;
    if (Math.abs(d) >= 0.01){ TX().push({id: newId("t"), ts: Date.now() + n, type: "adjust", account: k, amount: d, category: "adjust", note: "Matched bank", date: iso(today())}); n++; }
  }
  if (!n){ toast("Balances already match"); return; }
  persist(); closeSheet(); toast("Balances updated");
}

/* --- backup --- */
async function exportData(){
  const name = `money-backup-${iso(today())}.json`;
  const blob = new Blob([JSON.stringify(DATA, null, 2)], {type: "application/json"});
  try {
    const file = new File([blob], name, {type: "application/json"});
    if (navigator.canShare && navigator.canShare({files: [file]})){ await navigator.share({files: [file], title: "$$$ backup"}); return; }
  } catch(e){ if (e && e.name === "AbortError") return; }
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}
function importData(file){
  const r = new FileReader();
  r.onload = () => {
    try { const d = JSON.parse(r.result); if (!d || !d.settings || !Array.isArray(d.tx)) throw 0; DATA = d; persist(); go("home"); toast("Backup restored"); }
    catch(e){ toast("That file isn't a $$$ backup"); }
  };
  r.readAsText(file);
}

/* ================= events ================= */
document.addEventListener("click", e => {
  const el = e.target.closest("button"); if (!el) return;
  const d = el.dataset;
  if (el.classList.contains("tab")) return go(d.view);
  if (el.id === "logBtn") return openLog();
  if (d.tab) return go(d.tab);
  if (d.open === "settings") return go("settings");
  if (d.open === "spending"){ spendMonth = null; return go("spending"); }
  if (d.open === "match") return openMatch();
  if ("close" in d){ EDIT = null; return closeSheet(); }
  if (d.log) return logEvent(d.log);
  if (d.h){ PLAN.h = +d.h; return render(); }
  if (d.raise){ PLAN.more = 0; S().autoSave = +d.raise; persist(); render(); return toast(`Auto save is now ${money(+d.raise)} a paycheck`); }
  if (d.month){ const m = new Date(spendMonth.y, spendMonth.m + +d.month, 1); spendMonth = {y: m.getFullYear(), m: m.getMonth()}; return render(); }
  if (d.deltx){
    if (pendingDel !== d.deltx){ pendingDel = d.deltx; return render(); }
    const t = TX().find(x => x.id === d.deltx); if (!t) return;
    DATA.tx = TX().filter(x => x.id !== t.id && !(t.group && x.group === t.group));
    pendingDel = null; persist(); render(); return toast("Deleted");
  }
  // log sheet
  if (d.ftype){ readLog(); F.type = d.ftype; F.ref = null; if (d.ftype !== "income") F.amount = ""; return drawLog(false); }
  if (d.move){ readLog(); F.move = d.move; if (d.move === "cardpay" && !num(F.amount)){ const c = balances().card; if (c > 0) F.amount = c.toFixed(2); } return drawLog(false); }
  if (d.cat){ readLog(); F.cat = d.cat; return drawLog(false); }
  if (d.method){ readLog(); F.method = d.method; return drawLog(false); }
  if (d.src){ readLog(); F.source = d.src; const s = (S().income || []).find(i => i.id === d.src); F.amount = s ? String(s.amount) : ""; return drawLog(false); }
  if (d.allcats){ readLog(); F.allCats = true; return drawLog(false); }
  if (d.newcat){ readLog(); F.newCat = true; return drawLog(false); }
  if (d.addcat){
    const label = ($("#fNewCat")?.value || "").trim(); if (!label) return toast("Type a category name first");
    readLog(); const c = {id: newId("c"), label, group: d.addcat, budget: 0}; S().categories = [...cats(), c]; persist();
    F.newCat = null; F.cat = c.id; return drawLog(false);
  }
  if (el.id === "fGo") return submitLog();
  // editors
  if (d.edit){ const [k, id] = d.edit.split(":"); return openEditor(k, id); }
  if (d.egroup){ EDIT.group = d.egroup; $$("[data-egroup]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.egroup === d.egroup))); return; }
  if (el.id === "eSave") return saveEditor();
  if (el.id === "eDel") return deleteEditor();
  if (el.id === "mGo") return saveMatch();
  if (el.id === "exportBtn") return exportData();
  if (el.id === "importBtn") return $("#importFile").click();
});
document.addEventListener("input", e => {
  if (e.target.id === "pCut" || e.target.id === "pMore"){ PLAN[e.target.id === "pCut" ? "cut" : "more"] = +e.target.value; updatePlan(); }
  if (e.target.id === "fAmt"){ sizeAmt(); const a = num(e.target.value); $("#fGo").textContent = a > 0 ? "Log " + money(a, true) : "Log it"; }
});
document.addEventListener("change", e => {
  const t = e.target;
  if (t.id === "fAuto") F.auto = t.checked;
  if (t.id === "pSpend"){ PLAN.spend = t.checked; updatePlan(); }
  if (t.id === "eFreq" || t.id === "eCard") syncEditor();
  if (t.id === "importFile" && t.files[0]){ importData(t.files[0]); t.value = ""; }
  if (t.dataset.bud){ const c = cats().find(x => x.id === t.dataset.bud); if (c){ c.budget = num(t.value); persist(); t.value = c.budget ? money(c.budget) : ""; toast(`${c.label} budget ${c.budget ? "set to " + money(c.budget) : "removed"}`); } }
  if (t.dataset.set){
    const k = t.dataset.set;
    if (k === "goalName"){ S().goal = {...(S().goal || {}), name: t.value.trim() || "Savings goal"}; }
    else if (k === "goalTarget"){ S().goal = {...(S().goal || {}), target: num(t.value)}; t.value = money(num(t.value)); }
    else { S()[k] = num(t.value); t.value = money(num(t.value)); }
    persist(); toast("Saved");
  }
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && !$("#sheet").hidden){ EDIT = null; closeSheet(); }
  if (e.key === "Enter" && e.target.tagName === "INPUT"){
    if (e.target.id === "fNewCat"){ e.preventDefault(); $('[data-addcat="wants"]')?.click(); }
    else if (e.target.closest("#sheet") && $("#fGo")){ e.preventDefault(); submitLog(); }
    else if (e.target.classList.contains("inl")) e.target.blur();
  }
});
// refresh dates when the app comes back to the foreground
document.addEventListener("visibilitychange", () => { if (!document.hidden && $("#sheet").hidden) render(); });

render();
if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
